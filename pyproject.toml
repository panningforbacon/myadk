[project]
name = "myadk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "google-adk>=2.8.0",
    "hypercorn>=0.18.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[project.scripts]
adk-chat = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 600
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E402"]
unfixable = ["F401"]

[tool.pyright]
typeCheckingMode = "basic"  # "off", "basic", "standard", "strict"include = ["src"]
pythonVersion = "3.14"
pythonPlatform = "All"
